name: Core-Auth CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Quality Gate — Lint | SAST | Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER:     coreauth
          POSTGRES_PASSWORD: coreauth_secret
          POSTGRES_DB:       coreauth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U coreauth"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=6

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=6

    env:
      DATABASE_URL:                  "sqlite+aiosqlite:///:memory:"
      SECRET_KEY:                    "ci-access-secret-key-for-testing-only-32chars"
      REFRESH_SECRET_KEY:            "ci-refresh-secret-key-for-testing-only-32chars"
      ALGORITHM:                     "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES:   15
      REFRESH_TOKEN_EXPIRE_DAYS:     7
      REDIS_URL:                     "redis://localhost:6379"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: "[Lint] ruff — Fast Python Linter"
        run: ruff check app/ tests/

      - name: "[Lint] flake8 — PEP8 Style Compliance"
        run: |
          flake8 app/ tests/ \
            --max-line-length=79 \
            --exclude=__pycache__,.venv,venv \
            --count \
            --statistics

      - name: "[SAST] bandit — Static Application Security Testing"
        run: |
          bandit -r app/ \
            --severity-level medium \
            --confidence-level medium \
            -f txt \
            -o bandit-report.txt --exit-zero
          cat bandit-report.txt

          bandit -r app/ --severity-level high --confidence-level high

      - name: Upload SAST Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.txt

      - name: "[Tests] pytest — Async Integration Tests"
        run: |
          pytest tests/ \
            --asyncio-mode=auto \
            --tb=short \
            -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
